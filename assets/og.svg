<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062f3a"/>
      <stop offset="100%" stop-color="#041f27"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- concentric rings -->
  <g transform="translate(1000 150)" opacity="0.85">
    <circle r="300" fill="none" stroke="#f07b00" stroke-width="60"/>
    <circle r="200" fill="none" stroke="#00a3a6" stroke-width="40"/>
    <circle r="120" fill="none" stroke="#8f4b93" stroke-width="30"/>
    <circle r="50"  fill="#ffb547"/>
  </g>

  <text x="80" y="200" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#ffb547" letter-spacing="4">EU ANNUAL REPORT 2026</text>
  <text x="80" y="340" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" fill="#fff" letter-spacing="-4">Europe’s future</text>
  <text x="80" y="450" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" fill="#fff" letter-spacing="-4">is built <tspan fill="#ffb547">locally.</tspan></text>
  <text x="80" y="540" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#fff" opacity="0.8">20 places · 10 signals · one question</text>
</svg>
